[package]
name = "txio"
version = "1.0.0"
description = "Txio desktop: one console for every chain"
authors = ["King Vic"]
license = "MIT"
repository = "https://github.com/Txio-labs/txio-desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "txio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-process = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli"] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.13.3"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
