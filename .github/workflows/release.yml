name: Release
# Builds installers on each platform when a version tag is pushed, and attaches them
# to a GitHub release. Binaries are not code-signed (see README, "Installing").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # start the Pages workflow, which rebuilds the APT and RPM repositories

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage,rpm
          - platform: macos-14       # Apple silicon
            bundles: dmg,app
          - platform: macos-15-intel # Intel
            bundles: dmg,app
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Desktop dependencies
        run: npm ci

      # The web app is built from Txio-labs/txio at the ref below and bundled into the app
      # (scripts/build-frontend.sh, run by tauri's beforeBuildCommand).
      - name: Web app source
        shell: bash
        run: |
          git clone --depth 1 --branch "${TXIO_FRONTEND_REF:-main}" https://github.com/Txio-labs/txio.git ../Txio-frontend
          cd ../Txio-frontend && npm ci --no-audit --no-fund
        env:
          TXIO_FRONTEND_REF: ${{ vars.TXIO_FRONTEND_REF }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the auto-update packages; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Txio ${{ github.ref_name }}
          releaseBody: |
            One console for every chain: build, simulate, sign and run RPC calls and transactions on Sui, Ethereum and EVM chains, Solana, Aptos and Stellar.

            Download the file for your system:
            - Linux: `.deb` (Debian, Ubuntu, Kali), `.AppImage` (any distribution) or `.rpm`
            - macOS: `.dmg` (`aarch64` for Apple silicon, `x64` for Intel)
            - Windows: `-setup.exe` or `.msi`

            Already have Txio 1.x from this page? It updates itself: you'll be asked to install and restart. The old Electron build does not update itself; install this version over it.

            These builds are not code-signed yet. See the README's "Installing" section for how to open them on macOS and Windows.
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  notes:
    # After every platform has uploaded, turn the flat file list into a per-platform table.
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write download table into the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_notes.py "${{ github.ref_name }}"
      - name: Update the Homebrew cask and Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main && git checkout main
          python3 scripts/package_manifests.py "${{ github.ref_name }}"
          git add Casks bucket
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(packages): Homebrew and Scoop manifests for ${{ github.ref_name }}"
            git push origin main
          fi
      - name: Rebuild the APT and RPM repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
